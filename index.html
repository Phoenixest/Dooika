<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Dooika</title>
    <link class="game-favicon" rel="shortcut icon" href="TemplateData/favicon.svg">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Fondo en mosaico */
      .bg-tiled-pattern {
        background-color: #1a1637;
        background-image: url('TemplateData/bg_pattern.png');
        background-repeat: repeat;
        background-size: auto;
      }
    </style>
  </head>
  <body class="bg-[#1a1637] text-slate-100 font-sans flex flex-col h-screen overflow-hidden m-0 p-0 selection:bg-indigo-500/30">

    <!-- Header -->
    <header id="app-header" class="w-full bg-[#1B1230] py-2 sm:py-3.5 flex justify-center items-center shadow-md z-10 shrink-0 min-h-[44px] sm:min-h-[64px]">
        <div class="flex items-center justify-center px-4">
            <img src="TemplateData/Logo.png" alt="Dooika" class="game-logo h-7 sm:h-12 w-auto block object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <span style="display: none;" class="text-xs sm:text-base font-black text-white tracking-widest uppercase">Dooika</span>
        </div>
    </header>

    <!-- Banner de notificaciones/errores de Unity -->
    <div id="unity-warning" class="fixed top-4 z-50 max-w-md w-full px-4 hidden"></div>

    <!-- Layout Principal -->
    <main id="app-main" class="w-full flex-1 flex flex-col items-center justify-center p-2 sm:p-4 bg-tiled-pattern overflow-hidden min-h-0">

      <!-- Contenedor del Juego -->
      <div id="unity-container-wrapper" class="w-full h-full flex flex-col items-center justify-center my-auto min-h-0">
          
        <div id="unity-container" 
            class="relative overflow-hidden rounded-2xl sm:rounded-[24px] border-2 border-[#2f275c] bg-[#1B1230] shadow-2xl h-full max-h-[70vh] sm:max-h-[75vh] max-w-full"
            style="aspect-ratio: 338 / 600;">

            <canvas id="unity-canvas" tabindex="-1" class="w-full h-full block object-contain"></canvas>
            
            <!-- Overlay de Carga -->
            <div id="unity-loading-bar" class="absolute inset-0 z-10 flex flex-col items-center justify-center gap-4 bg-[#1a1637]">
                <div id="unity-progress-bar-empty" class="w-36 sm:w-48 h-1.5 bg-slate-800 rounded-full overflow-hidden">
                    <div id="unity-progress-bar-full" class="h-full bg-indigo-500 transition-all duration-150 w-0"></div>
                </div>
            </div>
        </div>

        <!-- Botón de Pantalla Completa -->
        <div id="fullscreen-wrapper" class="shrink-0 mt-2 sm:mt-4">
          <button id="unity-fullscreen-button" class="px-6 sm:px-8 py-2 bg-[#1B1230] border border-[#2b2254] hover:border-indigo-500/50 text-[10px] sm:text-xs font-bold uppercase tracking-[0.2em] rounded-full transition-all duration-200 flex items-center gap-2 text-[#D3C5EF] hover:text-[#D3C5EF] shadow-lg hover:scale-105 active:scale-95">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path d="M1 1v6h2V3h4V1H1zm12 0v2h4v4h2V1h-6zM1 19h6v-2H3v-4H1v6zm16-4v4h-4v2h6v-6h-2z"/></svg>
              FULL SCREEN
          </button>
        </div>

      </div>

    </main>

    <!-- Footer -->
    <footer id="app-footer" class="w-full bg-[#1B1230] py-2 sm:py-3 flex justify-center items-center border-t border-[#1B1230] shrink-0">
        <div class="text-center text-[10px] sm:text-xs text-[#514966] tracking-wider font-medium px-2">
            &copy; PiCATCHi Games - Dooika
        </div>
    </footer>

    <!-- Script de inicialización de Unity -->
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') {
          div.style.cssText = 'background: rgba(220, 38, 38, 0.95); color: white; padding: 12px; margin-bottom: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); font-size: 13px; font-weight: 500;';
        } else {
          if (type == 'warning') {
            div.style.cssText = 'background: rgba(217, 119, 6, 0.95); color: white; padding: 12px; margin-bottom: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); font-size: 13px; font-weight: 500;';
          }
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Builds.loader.js";
      var config = {
        dataUrl: buildUrl + "/Builds.data",
        frameworkUrl: buildUrl + "/Builds.framework.js",
        codeUrl: buildUrl + "/Builds.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "PiCATCHi Games",
        productName: "Dooika",
        productVersion: "1.5",
        showBanner: unityShowBanner,
      };

      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
                     (navigator.maxTouchPoints && navigator.maxTouchPoints > 2);

      if (isMobile) {
        // 1. Ocultar interfaz secundaria (Header, Footer y Botón de Fullscreen)
        document.querySelector("#app-header").style.display = "none";
        document.querySelector("#app-footer").style.display = "none";
        document.querySelector("#fullscreen-wrapper").style.display = "none";

        // 2. Modificar contenedor para pantalla completa sin bordes ni padding
        var mainLayout = document.querySelector("#app-main");
        if (mainLayout) {
          mainLayout.style.padding = "0px";
          mainLayout.style.backgroundImage = "none";
        }

        container.style.borderRadius = "0px";
        container.style.border = "none";
        container.style.maxHeight = "100vh";
        container.style.removeProperty('aspect-ratio');
        container.style.width = "100vw";

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        

        function adjustMobileLayout() {
          var wHeight = window.innerHeight + "px";
          container.style.height = wHeight;
          canvas.style.width = "100vw";
          canvas.style.height = wHeight;
        }

        adjustMobileLayout();
        window.addEventListener('resize', adjustMobileLayout);
        window.addEventListener('orientationchange', adjustMobileLayout);
      } else {
        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          if (fullscreenButton) {
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }
        }).catch((message) => {
          unityShowBanner(message, 'error');
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
